<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alba Studio Textil</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:white;
color:#111;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
text-align:center;
}

.logo{
width:min(650px,90%);
margin-bottom:20px;
}

.subtitulo{
font-size:22px;
letter-spacing:8px;
font-weight:600;
margin-bottom:8px;
}

.est{
letter-spacing:4px;
font-size:16px;
margin-bottom:50px;
}

.boton{
display:inline-block;
padding:18px 45px;
border:2px solid #111;
border-radius:40px;
text-decoration:none;
color:#111;
font-weight:700;
letter-spacing:3px;
transition:.3s;
}

.boton:hover{
background:#111;
color:white;
}

</style>
</head>

<body>

<section class="hero">

<img src="logo.png" class="logo" alt="Alba Studio Textil">

<p class="subtitulo">DESIGN &amp; SEWING</p>

<p class="est">– EST 2026 –</p>

<a href="#coleccion" class="boton">
VER COLECCIÓN
</a>

</section>

<section id="coleccion" style="padding:80px 20px;text-align:center;">
<h2 style="font-size:38px;margin-bottom:15px;">Próximamente</h2>

<p style="font-size:18px;color:#666;">
Muy pronto encontrarás aquí nuestros neceseres, scrunchies y accesorios.
</p>

</section>

</body>
</html>
