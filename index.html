<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alba Studio Textil</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:#111;
}

.hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

h1{
    font-size:clamp(60px,10vw,120px);
    font-weight:900;
    line-height:1;
}

.subtitulo{
    margin-top:25px;
    letter-spacing:8px;
    font-size:18px;
    font-weight:bold;
}

.est{
    margin-top:10px;
    letter-spacing:4px;
    font-size:16px;
}

.boton{
    margin-top:60px;
    display:inline-block;
    padding:18px 45px;
    border:2px solid #111;
    border-radius:40px;
    text-decoration:none;
    color:#111;
    font-weight:bold;
    letter-spacing:2px;
    transition:.3s;
}

.boton:hover{
    background:#111;
    color:white;
}
</style>

</head>

<body>

<section class="hero">

<h1>Alba</h1>

<p class="subtitulo">DESIGN &amp; SEWING</p>

<p class="est">- EST 2026 -</p>

<a class="boton" href="#">VER COLECCIÓN</a>

</section>

</body>
</html>
